{% extends 'base.html' %}

{% block title %}Internal Server Error (500) | TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5 text-center">
    <div class="col-md-6">
        <div class="card p-5 bg-white border-0 shadow-sm">
            <div class="display-1 fw-bold text-warning mb-3">500</div>
            <h3 class="fw-bold mb-2">Internal Server Error</h3>
            <p class="text-muted mb-4">
                Something unexpected happened on our server. Our team has been notified.
            </p>
            <div>
                <a href="{% url 'tasks:dashboard' %}" class="btn btn-primary px-4 fw-semibold">
                    <i class="bi bi-house-door me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
