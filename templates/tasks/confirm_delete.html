{% extends 'base.html' %}

{% block title %}Confirm Deletion | TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 border-danger shadow-sm bg-white">
            <div class="text-center mb-3">
                <i class="bi bi-exclamation-triangle-fill text-danger display-4"></i>
                <h4 class="fw-bold mt-2">Confirm Delete</h4>
                <p class="text-muted small">
                    Are you sure you want to permanently delete <strong>{{ object_name }}</strong>?
                    This action cannot be undone.
                </p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-danger px-4 fw-semibold">
                        <i class="bi bi-trash me-1"></i> Yes, Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
