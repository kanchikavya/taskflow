{% extends 'base.html' %}

{% block title %}Access Denied (403) | TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5 text-center">
    <div class="col-md-6">
        <div class="card p-5 bg-white border-0 shadow-sm">
            <div class="display-1 fw-bold text-danger mb-3">403</div>
            <h3 class="fw-bold mb-2">Access Denied</h3>
            <p class="text-muted mb-4">
                You do not have permission to view or modify this project or task.
                Only assigned team members and managers can access this resource.
            </p>
            <div>
                <a href="{% url 'tasks:dashboard' %}" class="btn btn-primary px-4 fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i> Back to Safety
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
